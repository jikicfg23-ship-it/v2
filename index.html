<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChaosCrypt | نظام التشفير بالبصمة الفوضوية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">🌀 ChaosCrypt</div>
            <p class="subtitle">نظام ابتكاري لتشفير النصوص إلى بصمات هندسية فوضوية محمية بكلمة مرور</p>
        </header>

        <div class="main-content">
            <div class="control-panel">
                <div class="input-group">
                    <label for="textInput">النص أو الرابط المراد تشفيره:</label>
                    <textarea id="textInput" placeholder="اكتب مقالك الثمين أو الرابط هنا..."></textarea>
                </div>

                <div class="input-group">
                    <label for="passwordInput">كلمة المرور السرية (المفتاح):</label>
                    <input type="password" id="passwordInput" placeholder="أدخل كلمة مرور قوية لتوليد الخريطة">
                </div>

                <div class="button-group">
                    <button id="btnEncrypt" class="btn-primary">⚡ توليد البصمة الفوضوية</button>
                </div>
            </div>

            <div class="preview-panel">
                <h3>البصمة الفوضوية الناتجة</h3>
                <div class="canvas-wrapper">
                    <canvas id="chaosCanvas" width="400" height="400"></canvas>
                </div>
                <button id="btnDownload" class="btn-secondary" style="display: none;">💾 حفظ صورة الشفرة</button>
            </div>
        </div>
        
        <footer>
            مشروع مفتوح المصدر على GitHub | ChaosCrypt © 2026
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
